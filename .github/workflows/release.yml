name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to preview or release"
        required: true
        type: string
      target:
        description: "Optional ref for a historical notes preview"
        required: false
        type: string
      publish:
        description: "Build images, push the tag, and publish the release"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.publish && 'publish' || 'preview' }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: artefactual/ambox
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ambox

jobs:
  validate-version:
    name: Validate semantic version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          sparse-checkout: .github/actions/validate-semver
          fetch-depth: 0
          fetch-tags: true
      - name: Validate semantic version
        uses: ./.github/actions/validate-semver
        with:
          version: ${{ github.event.inputs.version }}
      - name: Check release tag
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists: $VERSION" >&2
            exit 1
          fi

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-24.04
    needs: [validate-version]
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve notes target
        id: target
        env:
          PUBLISH: ${{ inputs.publish }}
          REQUESTED_TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" && -n "$REQUESTED_TARGET" ]]; then
            echo "A custom target can only be used for a preview" >&2
            exit 1
          fi
          target_ref=$GITHUB_SHA
          if [[ -n "$REQUESTED_TARGET" ]]; then
            target_ref=$REQUESTED_TARGET
          elif [[ "$PUBLISH" != "true" ]] &&
            git rev-parse --verify "refs/tags/${VERSION}^{commit}" \
              >/dev/null 2>&1; then
            target_ref="refs/tags/$VERSION"
          fi
          target_commit=$(git rev-parse --verify "${target_ref}^{commit}")
          echo "commit=$target_commit" >> "$GITHUB_OUTPUT"
      - name: Prepare release-note inputs
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          notes_dir="$RUNNER_TEMP/release-notes"
          .github/actions/release/prepare-notes.sh \
            --version "$VERSION" \
            --target "$TARGET" \
            --repo "$REPOSITORY" \
            --output-dir "$notes_dir" \
            --template .github/release-notes-prompt.md
      - name: Install Copilot CLI
        id: install_copilot
        continue-on-error: true
        env:
          COPILOT_AUTO_UPDATE: "false"
        run: npm install --global @github/copilot@1.0.78
      - name: Generate summaries with Copilot
        if: ${{ steps.install_copilot.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/release-notes
        env:
          COPILOT_AUTO_UPDATE: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -s --no-ask-user --disable-builtin-mcps \
            < prompt.md > copilot-summary.md
      - name: Compose release notes
        run: |
          notes_dir="$RUNNER_TEMP/release-notes"
          args=(
            --fallback "$notes_dir/fallback.md"
            --footer "$notes_dir/footer.md"
            --output "$notes_dir/release-notes.md"
            --source-output "$notes_dir/source.txt"
          )
          if [[ -s "$notes_dir/copilot-summary.md" ]]; then
            args+=(--summary "$notes_dir/copilot-summary.md")
          fi
          .github/actions/release/compose-notes.sh "${args[@]}"
      - name: Add notes to job summary
        run: |
          notes_dir="$RUNNER_TEMP/release-notes"
          source=$(<"$notes_dir/source.txt")
          {
            printf '# Release notes preview\n\n'
            printf 'Summary source: `%s`\n\n' "$source"
            cat "$notes_dir/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: release-notes-${{ inputs.version }}
          path: ${{ runner.temp }}/release-notes
          if-no-files-found: error
          retention-days: 7

  image-build:
    name: "Build Docker images"
    needs: [validate-version, seed-cache]
    if: ${{ inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c" # v4.2.0
      - name: "Derive platform pair"
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: "Compute seed cache key"
        run: |
          echo "AM_SEED_KEY=$(./hack/box/scripts/seed/key.sh)" >> "$GITHUB_ENV"
      - name: "Log in to Docker Hub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Docker meta"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
      - name: "Build and push by digest"
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./hack/box/Dockerfile
          provenance: false
          sbom: false
          build-args: |
            AM_SEED_CACHE_IMAGE=ghcr.io/${{ github.repository_owner }}/ambox-build-cache:seed-${{ env.AM_SEED_KEY }}
            AM_SEED_KEY=${{ env.AM_SEED_KEY }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ambox-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ambox-${{ env.PLATFORM_PAIR }}
      - name: "Export image digest"
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: "Upload image digest"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-test:
    name: "Test Docker image"
    needs: [image-build]
    if: ${{ inputs.publish }}
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/ambox
      digest-artifact: digests-linux-amd64

  image-merge:
    name: "Publish Docker manifests"
    runs-on: ubuntu-24.04
    needs: [image-test]
    if: ${{ inputs.publish }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Download image digests"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: "Log in to Docker Hub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c" # v4.2.0
      - name: "Create manifest list and push to Docker Hub"
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)
      - name: "Create manifest list and push to GHCR"
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:latest \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
      - name: "Inspect images"
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.version }}
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: [image-merge, release-notes]
    if: >-
      ${{
        always() &&
        inputs.publish &&
        needs.image-merge.result == 'success' &&
        needs.release-notes.result == 'success'
      }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes-${{ inputs.version }}
          path: ${{ runner.temp }}/release-notes
      - name: Push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Create GitHub Release
        uses: ./.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.event.inputs.version }}
          title: ${{ github.event.inputs.version }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md

  seed-cache:
    name: "Build seed cache"
    needs: [validate-version]
    if: ${{ inputs.publish }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/seed-cache.yml
