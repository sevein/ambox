name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g., 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: artefactual/ambox
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ambox

jobs:
  validate-version:
    name: Validate semantic version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: "actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8" # v6.0.1
        with:
          sparse-checkout: .github/actions/validate-semver
      - name: Validate semantic version
        uses: ./.github/actions/validate-semver
        with:
          version: ${{ github.event.inputs.version }}

  image-build:
    name: "Build Docker images"
    needs: [validate-version, seed-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8" # v6.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f" # v3.12.0
      - name: "Derive platform pair"
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: "Compute seed cache key"
        run: |
          echo "AM_SEED_KEY=$(./hack/box/scripts/seed/key.sh)" >> "$GITHUB_ENV"
      - name: "Log in to Docker Hub"
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Docker meta for Docker Hub"
        id: meta-dockerhub
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
      - name: "Build and push to Docker Hub by digest"
        id: build-dockerhub
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          file: ./hack/box/Dockerfile
          provenance: false
          sbom: false
          build-args: |
            AM_SEED_CACHE_IMAGE=ghcr.io/${{ github.repository_owner }}/ambox-build-cache:seed-${{ env.AM_SEED_KEY }}
            AM_SEED_KEY=${{ env.AM_SEED_KEY }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: "Export Docker Hub digest"
        run: |
          mkdir -p "${{ runner.temp }}/digests-dockerhub"
          digest="${{ steps.build-dockerhub.outputs.digest }}"
          touch "${{ runner.temp }}/digests-dockerhub/${digest#sha256:}"
      - name: "Upload Docker Hub digest"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: digests-dockerhub-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-dockerhub/*
          if-no-files-found: error
          retention-days: 1
      - name: "Docker meta for GHCR"
        id: meta-ghcr
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
      - name: "Build and push to GHCR by digest"
        id: build-ghcr
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          file: ./hack/box/Dockerfile
          provenance: false
          sbom: false
          build-args: |
            AM_SEED_CACHE_IMAGE=ghcr.io/${{ github.repository_owner }}/ambox-build-cache:seed-${{ env.AM_SEED_KEY }}
            AM_SEED_KEY=${{ env.AM_SEED_KEY }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: "Export GHCR digest"
        run: |
          mkdir -p "${{ runner.temp }}/digests-ghcr"
          digest="${{ steps.build-ghcr.outputs.digest }}"
          touch "${{ runner.temp }}/digests-ghcr/${digest#sha256:}"
      - name: "Upload GHCR digest"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: digests-ghcr-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-ghcr/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: "Publish Docker manifests"
    runs-on: ubuntu-24.04
    needs: [image-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Download Docker Hub digests"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests-dockerhub
          pattern: digests-dockerhub-*
          merge-multiple: true
      - name: "Download GHCR digests"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests-ghcr
          pattern: digests-ghcr-*
          merge-multiple: true
      - name: "Log in to Docker Hub"
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f" # v3.12.0
      - name: "Create manifest list and push to Docker Hub"
        working-directory: ${{ runner.temp }}/digests-dockerhub
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)
      - name: "Create manifest list and push to GHCR"
        working-directory: ${{ runner.temp }}/digests-ghcr
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:latest \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
      - name: "Inspect images"
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.version }}
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: [image-merge]
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Push release tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin refs/tags/${{ github.event.inputs.version }}
      - name: Create GitHub Release
        uses: ./.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.event.inputs.version }}
          title: ${{ github.event.inputs.version }}

  seed-cache:
    name: "Build seed cache"
    needs: [validate-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/seed-cache.yml
