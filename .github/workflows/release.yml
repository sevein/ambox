name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g., 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: artefactual/ambox
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ambox

jobs:
  validate-version:
    name: Validate semantic version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          sparse-checkout: .github/actions/validate-semver
      - name: Validate semantic version
        uses: ./.github/actions/validate-semver
        with:
          version: ${{ github.event.inputs.version }}

  image-build:
    name: "Build Docker images"
    needs: [validate-version, seed-cache]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c" # v4.2.0
      - name: "Derive platform pair"
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: "Compute seed cache key"
        run: |
          echo "AM_SEED_KEY=$(./hack/box/scripts/seed/key.sh)" >> "$GITHUB_ENV"
      - name: "Log in to Docker Hub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Docker meta"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
      - name: "Build and push by digest"
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./hack/box/Dockerfile
          provenance: false
          sbom: false
          build-args: |
            AM_SEED_CACHE_IMAGE=ghcr.io/${{ github.repository_owner }}/ambox-build-cache:seed-${{ env.AM_SEED_KEY }}
            AM_SEED_KEY=${{ env.AM_SEED_KEY }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ambox-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ambox-${{ env.PLATFORM_PAIR }}
      - name: "Export image digest"
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: "Upload image digest"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-test:
    name: "Test Docker image"
    needs: [image-build]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/ambox
      digest-artifact: digests-linux-amd64

  image-merge:
    name: "Publish Docker manifests"
    runs-on: ubuntu-24.04
    needs: [image-test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Download image digests"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: "Log in to Docker Hub"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c" # v4.2.0
      - name: "Create manifest list and push to Docker Hub"
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)
      - name: "Create manifest list and push to GHCR"
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }} \
            -t ${{ env.GHCR_IMAGE }}:latest \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
      - name: "Inspect images"
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ github.event.inputs.version }}
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.event.inputs.version }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: [image-merge]
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Push release tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin refs/tags/${{ github.event.inputs.version }}
      - name: Create GitHub Release
        uses: ./.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.event.inputs.version }}
          title: ${{ github.event.inputs.version }}

  seed-cache:
    name: "Build seed cache"
    needs: [validate-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/seed-cache.yml
