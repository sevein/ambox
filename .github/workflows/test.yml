name: "Test ambox"

on:
  pull_request:
  push:
    branches:
      - "dev/ambox"
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: "Candidate image repository"
        required: true
        type: string
      digest-artifact:
        description: "Artifact containing the candidate digest"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test image
    if: inputs.image == ''
    runs-on: ubuntu-24.04
    concurrency:
      group: test-ambox-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize Storage Service submodule
        run: >-
          git submodule update --init
          hack/submodules/archivematica-storage-service
      - name: Build image
        env:
          SEED_CACHE_IMAGE_REMOTE: ghcr.io/${{ github.repository_owner }}/ambox-build-cache
        run: make -C hack/box build
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: hack/box/e2e/uv.lock
      - name: Install Chromium
        run: >-
          uv run --project hack/box/e2e --locked
          playwright install --with-deps chromium
      - name: Test image
        env:
          AMBOX_SKIP_BUILD: "1"
        run: make -C hack/box verify
      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ambox-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: hack/box/e2e/output
          if-no-files-found: warn
          retention-days: 7

  test-candidate:
    name: Test release candidate
    if: inputs.image != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.digest-artifact }}
          path: ${{ runner.temp }}/digest
      - name: Resolve image digest
        env:
          DIGEST_DIR: ${{ runner.temp }}/digest
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$DIGEST_DIR"/*)
          if [ "${#digest_files[@]}" -ne 1 ]; then
            echo "Expected one image digest, found ${#digest_files[@]}" >&2
            exit 1
          fi
          digest="${digest_files[0]##*/}"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=sha256:$digest" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull candidate image
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
        run: |
          docker pull "$CANDIDATE_IMAGE@$IMAGE_DIGEST"
          docker tag "$CANDIDATE_IMAGE@$IMAGE_DIGEST" artefactual/ambox:test
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: hack/box/e2e/uv.lock
      - name: Install Chromium
        run: >-
          uv run --project hack/box/e2e --locked
          playwright install --with-deps chromium
      - name: Test candidate image
        env:
          AMBOX_SKIP_BUILD: "1"
        run: make -C hack/box verify
      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ambox-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: hack/box/e2e/output
          if-no-files-found: warn
          retention-days: 7
