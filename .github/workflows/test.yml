name: "Test ambox"

# Branch/PR builds have job-level cancellation below. Candidate verification
# follows its release caller and must not cancel another version's release.
# jactionlint ignore=concurrency-limits
on:
  pull_request:
  push:
    branches:
      - "dev/ambox"
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: "Candidate image repository"
        required: true
        type: string
      digest-artifact:
        description: "Artifact containing the candidate digest"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    timeout-minutes: 90
    name: Build and test image
    if: ${{ inputs.image == '' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: test-ambox-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Initialize Storage Service submodule
        run: >-
          git submodule update --init
          hack/submodules/archivematica-storage-service
      - name: Build image
        env:
          SEED_CACHE_IMAGE_REMOTE: ghcr.io/${{ github.repository_owner }}/ambox-build-cache
        run: make -C hack/box build
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: hack/box/e2e/uv.lock
      - name: Install Chromium
        run: >-
          uv run --project hack/box/e2e --locked
          playwright install --with-deps chromium
      - name: Test image
        env:
          AMBOX_SKIP_BUILD: "1"
        run: make -C hack/box verify
      - name: Upload end-to-end failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ambox-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: hack/box/e2e/output
          if-no-files-found: warn
          retention-days: 7

  test-candidate:
    timeout-minutes: 90
    name: Test release candidate
    if: ${{ inputs.image != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the digest artifact.
      contents: read
      packages: read # Pull the candidate image.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Download image digest
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.digest-artifact }}
          path: ${{ runner.temp }}/digest
      - name: Resolve image digest
        env:
          DIGEST_DIR: ${{ runner.temp }}/digest
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$DIGEST_DIR"/*)
          if [ "${#digest_files[@]}" -ne 1 ]; then
            echo "Expected one image digest, found ${#digest_files[@]}" >&2
            exit 1
          fi
          digest="${digest_files[0]##*/}"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=sha256:$digest" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull candidate image
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
        run: |
          docker pull "$CANDIDATE_IMAGE@$IMAGE_DIGEST"
          docker tag "$CANDIDATE_IMAGE@$IMAGE_DIGEST" artefactual/ambox:test
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-python: true
          cache-dependency-glob: hack/box/e2e/uv.lock
      - name: Install Chromium
        run: >-
          uv run --project hack/box/e2e --locked
          playwright install --with-deps chromium
      - name: Test candidate image
        env:
          AMBOX_SKIP_BUILD: "1"
        run: make -C hack/box verify
      - name: Upload end-to-end failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ambox-e2e-${{ github.job }}-${{ github.run_attempt }}
          path: hack/box/e2e/output
          if-no-files-found: warn
          retention-days: 7
