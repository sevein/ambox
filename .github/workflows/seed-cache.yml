name: "Seed cache"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  seed-cache:
    name: "Build seed cache"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # v6.0.3
        with:
          fetch-depth: 0
      - name: "Initialize required submodule"
        run: |
          git submodule update --init hack/submodules/archivematica-storage-service
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5" # v4.1.0
      - name: "Compute seed cache key"
        run: |
          echo "AM_SEED_KEY=$(./hack/box/scripts/seed/key.sh)" >> "$GITHUB_ENV"
      - name: "Log in to GHCR"
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check for existing multi-arch seed cache"
        id: seed-cache-check
        run: |
          tag="ghcr.io/${{ github.repository_owner }}/ambox-build-cache:seed-${AM_SEED_KEY}"
          if ! inspect=$(docker manifest inspect "$tag" 2>/dev/null); then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$inspect" | grep -q '"architecture": "amd64"' && echo "$inspect" | grep -q '"architecture": "arm64"'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Build and push seed cache image"
        if: steps.seed-cache-check.outputs.exists != 'true'
        env:
          SEED_CACHE_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ambox-build-cache
        run: |
          ./hack/box/scripts/seed/publish-cache.sh
