name: "Seed cache"

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  seed-cache:
    timeout-minutes: 180
    name: "Build seed cache"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Publish the seed cache to GHCR.
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
      - name: "Initialize required submodule"
        run: |
          git submodule update --init hack/submodules/archivematica-storage-service
      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@v4.4.1"
      - name: "Compute seed cache key"
        run: |
          echo "AM_SEED_KEY=$(./hack/box/scripts/seed/key.sh)" >> "$GITHUB_ENV"
      - name: "Log in to GHCR"
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check for existing multi-arch seed cache"
        id: seed-cache-check
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          tag="ghcr.io/${REPOSITORY_OWNER}/ambox-build-cache:seed-${AM_SEED_KEY}"
          if ! inspect=$(docker manifest inspect "$tag" 2>/dev/null); then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q '"architecture": "amd64"' <<< "$inspect" && grep -q '"architecture": "arm64"' <<< "$inspect"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Build and push seed cache image"
        if: ${{ steps.seed-cache-check.outputs.exists != 'true' }}
        env:
          SEED_CACHE_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ambox-build-cache
        run: |
          ./hack/box/scripts/seed/publish-cache.sh
